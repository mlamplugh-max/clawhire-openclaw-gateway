# Fly Machines config for the ClawHire OpenClaw Gateway worker.
# Auto start/stop maximizes idle density so the pooled worker costs ~$0 when
# no agent is active. Tune VM size + count to stay under the $300/mo cap.
#
# Deploy (Phase C — requires Fly creds this agent does NOT have):
#   fly launch --no-deploy --copy-config --name clawhire-openclaw-gateway
#   fly volumes create clawdata --size 3 --region <region>
#   fly secrets set OPENCLAW_API_KEY=$(openssl rand -hex 32) \
#                   TENANT_TOKEN_BROKER_URL=https://<your-control-plane>/api/internal/token-broker \
#                   TENANT_TOKEN_BROKER_KEY=$(openssl rand -hex 32)
#   fly deploy

app = "clawhire-openclaw-gateway"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "8000"
  OPENCLAW_ENGINE = "openclaw"
  WORKER_TENANCY_MODE = "pooled"
  DATA_ROOT = "/data/agents"
  OPENCLAW_HOME = "/data/openclaw"
  MONTHLY_COST_CAP_USD = "300"
  COST_CAP_ENFORCE = "true"
  LOG_LEVEL = "info"

[[mounts]]
  source = "clawdata"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

# Small, cost-friendly default. shared-cpu-1x / 512MB. Scale per cap.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
