# Fly Machines config for the OpenClaw multi-tenant worker.
#
# First deploy, in your own Fly organisation:
#   fly launch --copy-config --no-deploy        # then set `app` below to a name of your own (Fly app names are global)
#   fly volumes create clawdata --size 10       # ALL agent state lives on this volume at /data
#   fly secrets set OPENCLAW_API_KEY=$(openssl rand -hex 32) \
#                   TENANT_TOKEN_BROKER_URL=https://<your-control-plane>/api/internal/token-broker \
#                   TENANT_TOKEN_BROKER_KEY=$(openssl rand -hex 32) \
#                   OPENROUTER_API_KEY=...
#   fly deploy
#
# Auto start/stop keeps an idle worker near $0. Keep VM size and count under MONTHLY_COST_CAP_USD.

app = "my-openclaw-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  OPENCLAW_ENGINE = "openclaw"
  WORKER_TENANCY_MODE = "pooled"
  DATA_ROOT = "/data/agents"
  OPENCLAW_HOME = "/data/openclaw"
  MONTHLY_COST_CAP_USD = "300"
  COST_CAP_ENFORCE = "true"
  LOG_LEVEL = "info"

# The worker keeps ALL agent state on this volume (DATA_ROOT and OPENCLAW_HOME above).
# This section is not cosmetic: without it `fly deploy` can detach the volume and start the
# worker with zero agents.
[[mounts]]
  source = "clawdata"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

# The adapter is the only long-lived process, so a small VM is enough to start. Scale per your cap.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
